basics:
  name: Gabriel Trzimajewski
  label: Engenheiro de Software Sênior (Backend)
  email: gabriel@snowye.dev
  phone: '+55 (47) 98833-0284'
  location:
    city: Blumenau
    region: Santa Catarina
    countryCode: BR
  summary: >-
    Engenheiro de Software com foco em backend e mais de 5 anos construindo sistemas
    distribuídos, APIs e infraestrutura em nuvem em escala. Mais recentemente na K2 Partnering
    Solutions, alocado no Bradesco em uma plataforma interna de observabilidade e processamento
    de logs em escala bancária, com fluxo auditado de acesso por incidente e modernização de
    sistema legado em Java 8.
    Anteriormente na Mundo Invest, onde liderou a API de integração com a B3 processando
    ~100 mil requisições/dia para ~10 mil usuários ativos mensais, reduziu custos de nuvem em
    ~50% com migração de região via Terraform e rightsizing, diminuiu o tempo de investigação
    de incidentes em ~80% com alertas baseados em SLO no Datadog e levou consultas de busca
    no PostgreSQL de ~8s para menos de 200ms. Atua com Java e Spring Boot, TypeScript e
    Node.js, Go e C#/.NET com Entity Framework Core. Forte em engenharia de confiabilidade,
    observabilidade, mensageria com Kafka e gRPC, otimização de custos, tuning de banco de
    dados, sistemas financeiros e bancários, modernização de legado e integração
    mainframe-web. Também atua em IA aplicada na camada de aplicação e infraestrutura com
    LangChain, AI SDK e Claude Code, incluindo Skills e servidores MCP. Somente remoto;
    disponibilidade imediata. Autodidata, orientado a sistemas, com foco em confiabilidade e
    performance.
  profiles:
