work:
  - name: Bradesco
    position: Senior Software Engineer
    location: Remote, Brazil
    url: https://banco.bradesco
    startDate: '2025-04'
    endDate: '2026-06'
    summary: >-
      Allocated to Bradesco via K2 Partnering Solutions as a backend engineer on the Open Platform team, working on an
      existing internal log processing and observability platform used at banking scale for
      incident investigation and system monitoring, where he shipped new features and led the
      modernization of its legacy components.
    highlights:
      - Shipped new features into the existing log processing and observability platform used by Bradesco analysts to investigate incidents and monitor systems.
      - Designed and implemented an audited, incident-based log access workflow in which analysts retrieve logs by providing a ticket ID, eliminating manual access approvals from managers.
      - Reduced investigation time by more than 50% by removing the manual approval step from the log access path while keeping every query automatically audited.
      - Ensured full traceability and regulatory compliance by automatically auditing every log query against its originating incident ticket.
      - Led the modernization of a legacy Java 8 system through architectural refactoring, improving scalability and long-term maintainability.
      - Removed accumulated technical debt from the legacy codebase, reducing maintenance cost and making the system safer to change.
      - Redesigned the storage strategy for log data, optimizing resource usage and lowering infrastructure costs.
      - Implemented integrations between mainframe systems and modern web services in Java, bridging legacy infrastructure with distributed services.
      - Worked with Java and Spring Boot across the platform's ingestion, query, and access-control paths.
      - Operated inside a regulated banking environment where audit, compliance, and traceability requirements shaped the architecture.

  - name: Mundo Invest
    position: Backend Software Engineer
    location: Remote, Brazil
    startDate: '2024-02'
    endDate: '2025-03'
    summary: >-
      Distributed microservices for a Brazilian investment platform, including a B3 stock
      exchange integration API, AWS infrastructure, and observability.
    highlights:
      - Led development of a B3 (Brazilian stock exchange) integration API handling ~100k requests/day for ~10k monthly active users, enabling real-time stock transaction tracking.
      - Designed the B3 integration as a client-facing aggregation layer over internal services, a Backend for Frontend (BFF) exposing REST endpoints, webhooks, and Kafka consumers.
      - Built and maintained microservices with NestJS and TypeScript in a multi-repo microservice environment.
      - Designed and documented REST APIs extensively with OpenAPI/Swagger, giving client teams a contract they could build against without back-and-forth.
      - Improved test coverage and observability with JUnit and Datadog, reducing incident investigation time by ~80% and lowering MTTR across a 5-engineer team.
      - Migrated AWS infrastructure across regions using Terraform, reducing cloud costs by ~50% through workload analysis and rightsizing.
      - Designed Datadog dashboards and SLO-based alerting, improving error budget tracking and production reliability.
      - Automated CI/CD pipelines with GitHub Actions, Docker, ECS, and ECR, reducing deployment time from 15 minutes to 3 minutes.
      - Replaced synchronous REST communication with gRPC on latency-sensitive paths, reducing inter-service latency and improving tail performance.
      - Optimized PostgreSQL search queries using pg_trgm, reducing response times from ~8s to under 200ms under production load.
      - Developed and maintained distributed microservices and AWS Lambdas in Java with Spring Boot, Node.js with TypeScript and Express, and Go.
      - Engaged in architectural and communication design discussions with teams working on Kafka and gRPC integrations.
      - Led refactorings that improved cohesion and reduced coupling across services, alongside code performance improvements.
      - Worked with PostgreSQL and MongoDB as primary data stores across services.

  - name: Avalie Mais
    position: Full Stack Engineer
    location: Remote, Brazil
    startDate: '2021-12'
    endDate: '2024-02'
    summary: >-
      Anonymous retail survey platform with strict data-anonymization and privacy-compliance
      requirements.
    highlights:
      - Developed and managed an anonymous retail survey application that produced strategic insights, improving decision-making on store installations and organizational structure.
      - Designed and implemented a secure architecture guaranteeing complete data anonymization and full compliance with privacy regulations.
      - Built a highly optimized system that maintained zero performance issues despite continuously increasing user demand.
      - Delivered backend services with PHP 7 and Laravel, covered by PHPUnit tests.
      - Built the web frontend with React 17 and Tailwind CSS.
      - Modeled and tuned the MySQL schema backing survey collection and reporting.

  - name: Mercante
    position: Full Stack Engineer
    location: Remote, Brazil
    url: https://mercante.com.py
    startDate: '2021-07'
    endDate: '2023-06'
    summary: >-
      Part-time contract engineering for Mercante, a Paraguay-based digital agency, overlapping
      with the Avalie Mais role. E-commerce platforms and self-hosted infrastructure for SMBs
      in Brazil and Paraguay, several of which are still in production today.
    highlights:
      - Designed and delivered e-commerce platforms for 10+ small and medium businesses across Brazil and Paraguay through Mercante, achieving an average 30% increase in client sales after launch.
      - Shipped storefronts that are still live and serving customers in production years after delivery.
      - Architected self-hosted VPS infrastructures, cutting operational costs versus SaaS alternatives while retaining full control over performance and deployments.
      - Built storefronts with React, TypeScript, and Node.js, focusing on performance, SEO, and conversion.
      - Delivered backend services using NestJS.
      - 'Managed the full project lifecycle end to end: discovery, design, development, deployment, and post-launch support.'
      - Worked directly with non-technical business owners to turn commercial goals into technical scope.

