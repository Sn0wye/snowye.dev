name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['main']
  merge_group:
  workflow_dispatch:

jobs:
  lint-type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run check

      - name: Type check
        run: bun run typecheck

      - name: Agent readiness integration tests
        run: bun run test
