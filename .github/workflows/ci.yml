name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['main']
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Format
        run: bun fmt --check

      - name: Lint
        run: bun lint

      - name: Type check
        run: bun check

      - name: Audit
        run: bun audit --audit-level=high

      - name: Build
        run: bun run build

      - name: Agent readiness integration tests
        run: bun test tests
